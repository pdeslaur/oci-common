name: Build

# Builds the melange package in the caller's melange.yaml for each arch, runs
# its tests, and optionally publishes the apko.yaml image to
# ghcr.io/<caller repository> tagged with "latest" and the package version,
# signed keylessly with cosign.

on:
    workflow_call:
        inputs:
            publish:
                description: Publish the image to GHCR.
                type: boolean
                default: false

permissions: {}

jobs:
    build:
        runs-on: ${{ matrix.runner }}
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                arch: [x86_64, aarch64]
                include:
                    - arch: aarch64
                      runner: ubuntu-24.04-arm
                    - arch: x86_64
                      runner: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # Scheduled runs skip the cache so that toolchain fixes from
            # Wolfi (e.g. Go or Rust patch releases) are picked up.
            - name: Restore cached packages
              id: cache
              if: github.event_name != 'schedule'
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ./packages
                  key: melange-${{ matrix.arch }}-${{ hashFiles('melange.yaml') }}

            - uses: chainguard-dev/actions/setup-melange@8f31e9482b447ff2c69eca944a09b4b31a4a85d0 # v1.7.2
              if: steps.cache.outputs.cache-hit != 'true'

            # --build-date stamps the package with the time of the last commit,
            # as Wolfi does. Without it melange leaves the build date unset, so
            # apko dates the image by its newest Wolfi dependency instead. A
            # fixed date also keeps rebuilds of an unchanged config
            # reproducible. melange runs under sudo, which drops
            # SOURCE_DATE_EPOCH from the environment, hence the flag.
            - name: Build package
              if: steps.cache.outputs.cache-hit != 'true'
              env:
                  ARCH: ${{ matrix.arch }}
              run: |
                  melange keygen melange.rsa
                  sudo melange build melange.yaml \
                    --arch "$ARCH" \
                    --build-date "$(git log -1 --format=%cI)" \
                    --signing-key melange.rsa \
                    --source-dir . \
                    --out-dir ./packages
                  sudo chown -R runner:runner ./packages

            - name: Test package
              if: steps.cache.outputs.cache-hit != 'true'
              env:
                  ARCH: ${{ matrix.arch }}
              run: |
                  melange test melange.yaml \
                    --arch "$ARCH" \
                    --runner bubblewrap \
                    --repository-append ./packages \
                    --keyring-append ./melange.rsa.pub \
                    --repository-append https://packages.wolfi.dev/os \
                    --keyring-append https://packages.wolfi.dev/os/wolfi-signing.rsa.pub \
                    --test-package-append busybox

            - name: Upload packages
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: packages-${{ matrix.arch }}
                  path: ./packages
                  retention-days: 1
                  if-no-files-found: error

    publish:
        if: inputs.publish
        runs-on: ubuntu-latest
        needs: build
        permissions:
            contents: read
            id-token: write # for keyless signing with cosign
            packages: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: chainguard-dev/actions/setup-melange@8f31e9482b447ff2c69eca944a09b4b31a4a85d0 # v1.7.2

            - name: Download packages
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  pattern: packages-*
                  path: ./packages
                  merge-multiple: true

            - name: Re-index packages under a single key
              run: |
                  melange keygen melange.rsa
                  for arch in x86_64 aarch64; do
                    melange sign -k melange.rsa packages/$arch/*.apk
                    melange index -o packages/$arch/APKINDEX.tar.gz packages/$arch/*.apk
                    melange sign-index --signing-key melange.rsa packages/$arch/APKINDEX.tar.gz
                  done

            - name: Compute image tags
              id: tags
              env:
                  IMAGE: ghcr.io/${{ github.repository }}
              run: |
                  version=$(yq '.package.version' melange.yaml)
                  echo "tags=$IMAGE:latest $IMAGE:$version" >> "$GITHUB_OUTPUT"

            - name: Login to GHCR
              uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and publish image
              id: publish
              uses: chainguard-images/actions/apko-publish@8e701b320e7efcb120a1115de26e9fe833f86390 # v1.0.38
              with:
                  config: apko.yaml
                  tag: ${{ steps.tags.outputs.tags }}
                  keyring-append: ./melange.rsa.pub
                  repository-append: ./packages

            - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

            # Signs the image index and each per-arch image by digest. The
            # signing identity is this reusable workflow, see README.md.
            - name: Sign image
              env:
                  IMAGE: ${{ steps.publish.outputs.digest }}
              run: cosign sign --yes --recursive "$IMAGE"
